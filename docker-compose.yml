services:
  jenkins:
    image: local-jenkins:lts-docker
    container_name: jenkins
    user: root
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - compvalidator-app_jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock:z
    restart: unless-stopped

volumes:
  compvalidator-app_jenkins_home:
    external: true
